<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero Bitrix24 CIEN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="css">
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface2:#E9EBF0; --line:#D6D9E1; --line2:#C3C7D2;
  --text:#1B2435; --muted:#66708A; --faint:#9AA2B5;
  --navy:#1F3864; --navy2:#2C4A80; --gold:#B8892B; --gold-soft:#F4EBD6;
  --ok:#2E8B57; --ok-soft:#DDF1E4; --run:#2F6DB5; --run-soft:#DCE8F7; --warn:#D08A12; --warn-soft:#FBEBD0; --bad:#C0392B; --bad-soft:#F8DAD6; --pend:#9AA2B5; --pend-soft:#E9EBF0;
  --today:#C0392B; --shadow:0 6px 24px rgba(27,36,53,.12);
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171F; --surface:#1A212C; --surface2:#222B38; --line:#2F3A4A; --line2:#3C485B;
  --text:#E8ECF3; --muted:#A3ADC0; --faint:#6B778C;
  --navy:#8FB0E8; --navy2:#6F93D0; --gold:#D9AE55; --gold-soft:#3A3120;
  --ok:#5CC08A; --ok-soft:#1E3A2B; --run:#6FA3E8; --run-soft:#1F3352; --warn:#E6A83C; --warn-soft:#3F3218; --bad:#E5705F; --bad-soft:#4A2521; --pend:#7D889C; --pend-soft:#2A3341;
  --today:#E5705F; --shadow:0 6px 24px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  --bg:#12171F; --surface:#1A212C; --surface2:#222B38; --line:#2F3A4A; --line2:#3C485B;
  --text:#E8ECF3; --muted:#A3ADC0; --faint:#6B778C;
  --navy:#8FB0E8; --navy2:#6F93D0; --gold:#D9AE55; --gold-soft:#3A3120;
  --ok:#5CC08A; --ok-soft:#1E3A2B; --run:#6FA3E8; --run-soft:#1F3352; --warn:#E6A83C; --warn-soft:#3F3218; --bad:#E5705F; --bad-soft:#4A2521; --pend:#7D889C; --pend-soft:#2A3341;
  --today:#E5705F; --shadow:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--cond);text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1400px;margin:0 auto;padding:18px 24px 0;display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between}
.brand h1{font-size:26px;font-weight:700;color:var(--navy);line-height:1.1}
.brand .sub{color:var(--muted);margin-top:4px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{background:var(--surface2);border-radius:8px;padding:8px 14px;min-width:120px}
.kpi .v{font-family:var(--cond);font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--muted);margin-top:2px}
.tabs{max-width:1400px;margin:0 auto;padding:14px 24px 0;display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:8px 8px 0 0;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--gold);background:var(--bg)}
.tabs .spacer{flex:1}
.conn{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;padding-bottom:6px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--pend);display:inline-block}
.conn.live i{background:var(--ok)}
.conn.local i{background:var(--warn)}

main{max-width:1400px;margin:0 auto;padding:20px 24px 60px}
.panel{display:none}.panel.on{display:block}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--navy2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0F1622}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0F1622}}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.icon{padding:3px 6px;font-size:12px;line-height:1;border-radius:6px}
select.btn,input.btn{padding:6px 10px}
.hint{color:var(--muted);font-size:12px}
.hint.help{max-width:520px;line-height:1.35}
.hint.help b{color:var(--text);font-weight:600}
label.f small.help{color:var(--faint);font-size:11px;line-height:1.3}

/* status chips */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-pendiente{background:var(--pend-soft);color:var(--pend)} .s-curso{background:var(--run-soft);color:var(--run)}
.s-hecho{background:var(--ok-soft);color:var(--ok)} .s-bloqueado{background:var(--bad-soft);color:var(--bad)} .s-riesgo{background:var(--warn-soft);color:var(--warn)}
.t-avance{background:var(--run-soft);color:var(--run)} .t-decision{background:var(--gold-soft);color:var(--gold)} .t-riesgo{background:var(--warn-soft);color:var(--warn)} .t-paso{background:var(--ok-soft);color:var(--ok)} .t-nota{background:var(--pend-soft);color:var(--muted)}

/* gantt */
.gwrap{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:auto;box-shadow:var(--shadow)}
.gantt{display:grid;min-width:max-content;font-size:13px}
.gantt .hcell{position:sticky;top:0;z-index:3;background:var(--surface2);border-bottom:1px solid var(--line);text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);padding:4px 0}
.gantt .month{grid-row:1;border-left:1px solid var(--line2);font-weight:500;color:var(--text);text-transform:uppercase;letter-spacing:.06em}
.gantt .wk{grid-row:2}
.gantt .wk.now{color:var(--today);font-weight:600}
.gantt .lab{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line2);border-bottom:1px solid var(--line);padding:7px 12px;display:flex;align-items:center;gap:8px;min-width:0}
.gantt .lab.h{z-index:4;background:var(--surface2);grid-row:1/3;align-items:flex-end;font-family:var(--mono);font-size:11px;color:var(--muted)}
.gantt .lab .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt .lab .rs{font-size:11px;color:var(--muted);max-width:140px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gantt .lab.phase{background:var(--surface2);font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:12px;color:var(--navy)}
.gantt .cell{border-bottom:1px solid var(--line);border-left:1px solid var(--line);position:relative}
.gantt .cell.month-start{border-left-color:var(--line2)}
.gantt .cell.phase{background:var(--surface2)}
.gantt .cell.today{background:linear-gradient(90deg,transparent 49%,var(--today) 49%,var(--today) 51%,transparent 51%)}
.gantt .bar{grid-row:auto;height:18px;border-radius:4px;margin:8px 3px;position:relative;z-index:1;overflow:hidden;background:var(--pend-soft);cursor:pointer;border:1px solid transparent}
.gantt .bar.phase{height:8px;margin:14px 3px;background:var(--navy);opacity:.85;border-radius:2px;cursor:default}
.gantt .bar .fill{position:absolute;inset:0;width:0;border-radius:3px}
.gantt .bar.curso{background:var(--run-soft)} .gantt .bar.curso .fill{background:var(--run)}
.gantt .bar.hecho{background:var(--ok-soft)} .gantt .bar.hecho .fill{background:var(--ok)}
.gantt .bar.pendiente{background:var(--pend-soft);border-color:var(--line2)} .gantt .bar.pendiente .fill{background:var(--pend)}
.gantt .bar.bloqueado{background:var(--bad-soft)} .gantt .bar.bloqueado .fill{background:var(--bad)}
.gantt .bar:hover{outline:2px solid var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:14px;height:10px;border-radius:3px;display:inline-block}

/* plan table */
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.tblwrap{overflow-x:auto;border-radius:10px}
.tbl th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.phase td{background:var(--surface2);font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);font-size:12px}
.tbl td.num{font-family:var(--mono);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl td.act{white-space:nowrap;text-align:right}
.tbl tr:hover td{background:color-mix(in srgb,var(--gold) 6%,transparent)}
.prog{display:flex;align-items:center;gap:8px;min-width:120px}
.prog .bar{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.prog .bar i{display:block;height:100%;background:var(--run)}
.prog.hecho .bar i{background:var(--ok)}
.prog span{font-family:var(--mono);font-size:12px;width:36px;text-align:right}
.tbl .name{min-width:280px;max-width:520px}
.tbl .name small{display:block;color:var(--muted);font-size:12px;margin-top:2px;white-space:normal}

/* bitácora */
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:20px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow)}
.card h2{font-size:16px;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:10px}
.card h2 .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:400}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:96px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.log li:first-child{border-top:0}
.log .d{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:3px}
.log .d b{display:block;color:var(--text);font-weight:500}
.log .tx{white-space:pre-wrap}
.log .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;align-items:center}
.log .meta .who{font-size:12px;color:var(--muted)}
.log .meta .task{font-size:12px;color:var(--navy);background:var(--surface2);padding:1px 8px;border-radius:999px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:flex-start}
.steps li:first-child{border-top:0}
.steps input[type=checkbox]{margin-top:3px;accent-color:var(--ok)}
.steps .tx{flex:1}
.steps .tx.done{text-decoration:line-through;color:var(--muted)}
.steps .due{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.steps .due.late{color:var(--bad);font-weight:500}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line2);border-radius:8px}

/* dialog */
dialog{border:0;border-radius:12px;padding:0;background:var(--surface);color:var(--text);box-shadow:var(--shadow);width:min(640px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(15,20,30,.55)}
dialog form{padding:20px 22px}
dialog h2{font-size:18px;color:var(--navy);margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line2);background:var(--bg);border-radius:7px;padding:7px 9px;font-size:14px;color:var(--text)}
label.f textarea{min-height:80px;resize:vertical}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;align-items:center}
.actions .danger{margin-right:auto;color:var(--bad);border-color:transparent;background:transparent}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media print{.tabs,.toolbar,.btn,.conn{display:none!important}.panel{display:block!important;page-break-inside:avoid}.gwrap,.tbl,.card{box-shadow:none}}

/* read-only view */
body.ro [data-act="new-task"],body.ro [data-act="new-phase"],body.ro [data-act="new-log"],body.ro [data-act="import"],body.ro [data-act="edit"],body.ro [data-act="edit-log"],body.ro [data-act="up"],body.ro [data-act="down"],body.ro .steps input[type=checkbox]{display:none!important}
body.ro .gantt .bar{cursor:default}
body.client [data-act="export"],body.client [data-act="import"],body.client [data-act="download"]{display:none!important}
.kpi.clickable{cursor:pointer;border:1px solid transparent}.kpi.clickable:hover{border-color:var(--gold)}
.detail{list-style:none;margin:0;padding:0;max-height:60vh;overflow:auto}
.detail li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.detail li:first-child{border-top:0}
.detail .tx{flex:1}.detail .tx small{display:block;color:var(--muted);font-size:12px}
.detail .due{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.conn.ro i{background:var(--navy)} .conn.saving i{background:var(--gold)}
</style>

function setConn(cls,txt){ const c=$('#conn'); c.className='conn '+cls; c.lastElementChild.textContent=txt; }
function enterReadOnly(msg){ readOnly=true; document.body.classList.add('ro'); setConn('ro', msg||'solo lectura'); }
function applyState(o){ if(!o||!o.tasks) return; const api=S.meta.api; S.meta=Object.assign({},o.meta||{}); if(api&&!S.meta.api) S.meta.api=api; S.tasks=o.tasks||{}; S.log=o.log||{}; render(); }

/* --- shared backend (Apps Script web app): meta.api --- */
async function apiGet(){ const r=await fetch(API+'?t='+Date.now(),{cache:'no-store',redirect:'follow'}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
function apiSend(op){ apiQueue.push(op); setConn('saving','guardando…'); clearTimeout(apiT); apiT=setTimeout(apiFlush,500); }
async function apiFlush(){
  if(apiBusy||!apiQueue.length) return; apiBusy=true; const ops=apiQueue.splice(0);
  try{ const r=await fetch(API,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({ops})}); if(!r.ok) throw new Error('HTTP '+r.status);
    const o=await r.json(); if(!apiQueue.length) applyState(o); setConn('live','guardado · compartido'); }
  catch(e){ console.error(e); apiQueue.unshift(...ops); setConn('local','sin conexión · reintentando'); setTimeout(apiFlush,5000); }
  finally{ apiBusy=false; if(apiQueue.length) apiFlush(); }
}
async function apiPoll(){ if(apiBusy||apiQueue.length) return; try{ applyState(await apiGet()); }catch(_){} }

function schedulePublish(){
  dirty=true; S.meta.actualizado=new Date().toISOString();
  if(API){ return; }
  if(readOnly || !artifact){ setConn('local','cambios sin guardar (vista sin permiso de edición)'); return; }
  setConn('saving','guardando…');
  clearTimeout(publishT);
  publishT=setTimeout(async()=>{
    try{ await artifact.publish(buildHTML()); dirty=false; setConn('live','guardado · recargando'); }
    catch(e){
      const code=e&&e.code;
      if(code==='not_writer'||code==='not_granted'){ enterReadOnly('solo lectura · tus cambios no se guardan'); toast('Esta vista es de solo lectura'); }
      else if(code==='conflict'){ setConn('live','otra persona guardó · recargando'); }
      else if(code==='rate_limited'){ setConn('saving','esperando para guardar…'); setTimeout(schedulePublish,4000); }
      else { console.error(e); setConn('local','no se pudo guardar'); toast('No se pudo guardar: '+(code||'error')); }
    }
  },1200);
}
const store = {
  async setTask(t){ S.tasks[t.id]=t; render(); schedulePublish(); if(API) apiSend({op:'set',coll:'tasks',id:t.id,data:t}); },
  async delTask(id){ delete S.tasks[id]; const orphans=[]; Object.values(S.tasks).forEach(t=>{ if(t.fase===id){ t.fase=null; orphans.push(t); } }); render(); schedulePublish(); if(API){ apiSend({op:'del',coll:'tasks',id}); orphans.forEach(t=>apiSend({op:'set',coll:'tasks',id:t.id,data:t})); } },
  async setLog(e){ S.log[e.id]=e; render(); schedulePublish(); if(API) apiSend({op:'set',coll:'log',id:e.id,data:e}); },
  async delLog(id){ delete S.log[id]; render(); schedulePublish(); if(API) apiSend({op:'del',coll:'log',id}); },
  async setMeta(m){ Object.assign(S.meta,m); render(); schedulePublish(); if(API) apiSend({op:'set',coll:'meta',id:'meta',data:S.meta}); },
  async replaceAll(data){ Object.assign(S.meta,data.meta); S.tasks=data.tasks; S.log=data.log; render(); schedulePublish();
    if(API){ Object.values(S.tasks).forEach(t=>apiSend({op:'set',coll:'tasks',id:t.id,data:t})); Object.values(S.log).forEach(e=>apiSend({op:'set',coll:'log',id:e.id,data:e})); apiSend({op:'set',coll:'meta',id:'meta',data:S.meta}); } }
};
async function downloadHTML(){
  const html=buildHTML(); const name='tablero-bitrix24-cien.html';
  if(downloads){ try{ await downloads.save({filename:name,data:html}); toast('Archivo listo'); return; }catch(e){ if(e&&e.code==='declined') return; console.error(e); } }
  try{ await navigator.clipboard.writeText(html); toast('HTML copiado al portapapeles'); }catch(_){ toast('No se pudo descargar en esta vista'); }

async function connect(){
  if(inClaude){
    [artifact,downloads]=await Promise.all([window.claude.use('artifact'), window.claude.use('downloads')]);
    if(!artifact){ enterReadOnly('vista publicada · solo lectura'); return; }
    setConn('live','edición en vivo · los cambios se publican solos'); return;
  }
  // Hosted copy (GitHub Pages): data.json carries the current state and, optionally, meta.api (shared backend).
  document.body.classList.add('client');
  let remote=null;
  try{ const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'}); if(r.ok) remote=await r.json(); }catch(_){}
  if(remote && remote.tasks) applyState(remote);
  API = (S.meta && S.meta.api) || (remote && remote.meta && remote.meta.api) || null;
  if(!API){ enterReadOnly('vista publicada · solo lectura'); return; }
  setConn('saving','conectando…');
  try{ const o=await apiGet(); if(o && o.tasks && Object.keys(o.tasks).length){ applyState(o); } else { /* empty backend: seed it with what we have */ store.replaceAll({meta:S.meta,tasks:S.tasks,log:S.log}); }
    setConn('live','edición compartida · los cambios se guardan para todos'); }
  catch(e){ console.error(e); enterReadOnly('sin conexión con el servidor · solo lectura'); return; }
  pollT=setInterval(apiPoll,30000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) apiPoll(); });
}


/* ---------- derived ---------- */
function ordered(){
  const all=Object.values(S.tasks);
  const phases=all.filter(t=>t.tipo==='fase').sort((a,b)=>(a.orden||0)-(b.orden||0));
  const out=[];
  const used=new Set();
  for(const p of phases){
    used.add(p.id);
    const kids=all.filter(t=>t.tipo!=='fase' && t.fase===p.id).sort((a,b)=>(a.orden||0)-(b.orden||0));
    kids.forEach(k=>used.add(k.id));
    // phase span follows its activities when it has any
    const span = kids.length ? {inicio: kids.map(k=>k.inicio).sort()[0], fin: kids.map(k=>k.fin).sort().slice(-1)[0]} : {inicio:p.inicio, fin:p.fin};
    const av = kids.length ? Math.round(kids.reduce((s,k)=>s+(+k.avance||0),0)/kids.length) : (+p.avance||0);
    out.push({...p, ...span, avance:av, kids});
    kids.forEach(k=>out.push(k));
  }
  const orphans=all.filter(t=>!used.has(t.id)).sort((a,b)=>(a.orden||0)-(b.orden||0));
  if(orphans.length){ out.push({id:'__none',tipo:'fase',nombre:'Sin fase',inicio:orphans.map(k=>k.inicio).sort()[0],fin:orphans.map(k=>k.fin).sort().slice(-1)[0],avance:0,kids:orphans,virtual:true}); orphans.forEach(o=>out.push(o)); }
  return out;
}
function weekOf(iso){ return Math.floor(daysBetween(S.meta.inicio, iso)/7)+1; }

function renderKpis(){
  const tasks=Object.values(S.tasks).filter(t=>t.tipo!=='fase');
  const n=tasks.length, done=tasks.filter(t=>t.estatus==='hecho').length, run=tasks.filter(t=>t.estatus==='curso').length, blk=tasks.filter(t=>t.estatus==='bloqueado').length;
  const avg=n?Math.round(tasks.reduce((s,t)=>s+(+t.avance||0),0)/n):0;
  const wk=weekOf(todayISO());
  const late=tasks.filter(t=>t.estatus!=='hecho' && t.fin<todayISO()).length;
  const steps=Object.values(S.log).filter(e=>e.tipo==='paso'&&!e.hecho).length;
  $('#kpis').innerHTML=[
    ['S'+wk,'semana del plan · '+fmtD(todayISO()),'',false],

    [done+'/'+n,'actividades completadas','hecho',true],
    [run,'en curso','curso',true],

  ].concat(blk?[[blk,'bloqueadas','bloqueado',true]]:[]).map(([v,l,k,c])=>`<div class="kpi ${c?'clickable':''}" ${c?`data-act="kpi" data-k="${k}" role="button" tabindex="0"`:''}><div class="v" style="${k==='vencidas'&&v?'color:var(--bad)':''}${k===''&&l.startsWith('semana')?'color:var(--navy)':''}${k==='bloqueado'?'color:var(--bad)':''}">${v}</div><div class="l">${l}</div></div>`).join('');
  $('#title').textContent=S.meta.nombre||'Tablero de proyecto Bitrix24';

function renderGantt(){
  const rows=ordered();
  const W=S.meta.semanas||25; const g=$('#gantt');
  g.style.gridTemplateColumns=`minmax(380px,470px) repeat(${W},44px)`;
  const tw=weekOf(todayISO());
  let h='';
  h+=`<div class="lab h">Actividad · responsable</div>`;
  // month headers
  let col=2; let i=1;
  while(i<=W){
    const m=new Date(addDays(S.meta.inicio,(i-1)*7)+'T00:00:00').getMonth(); let j=i;
    while(j+1<=W && new Date(addDays(S.meta.inicio,j*7)+'T00:00:00').getMonth()===m) j++;
    const y=new Date(addDays(S.meta.inicio,(i-1)*7)+'T00:00:00').getFullYear();
    h+=`<div class="hcell month" style="grid-column:${col}/${col+(j-i+1)}">${MESES[m]} ${String(y).slice(2)}</div>`;
    col+=j-i+1; i=j+1;
  }
  for(let w=1;w<=W;w++) h+=`<div class="hcell wk ${w===tw?'now':''}" style="grid-column:${w+1};grid-row:2" title="${fmtDY(addDays(S.meta.inicio,(w-1)*7))}">S${w}</div>`;
  let r=3;
  for(const t of rows){
    const isP=t.tipo==='fase';
    const s=Math.max(1,weekOf(t.inicio)), e=Math.min(W,weekOf(t.fin));
    h+=`<div class="lab ${isP?'phase':''}" style="grid-row:${r}" title="${esc(t.nombre)}${t.resp?' — '+esc(t.resp):''}">${isP?'':`<span class="chip s-${t.estatus}" style="padding:1px 6px;font-size:10px"></span>`}<span class="nm">${esc(t.nombre)}</span>${t.resp&&!isP?`<span class="rs">${esc(t.resp)}</span>`:''}</div>`;
    for(let w=1;w<=W;w++){
      const ms=new Date(addDays(S.meta.inicio,(w-1)*7)+'T00:00:00').getDate()<=7;
      h+=`<div class="cell ${isP?'phase':''} ${ms?'month-start':''} ${w===tw?'today':''}" style="grid-column:${w+1};grid-row:${r}"></div>`;
    }
    if(e>=s){
      const pct=isP?t.avance:(t.estatus==='hecho'?100:(+t.avance||0));
      h+=`<div class="bar ${isP?'phase':t.estatus}" data-id="${t.virtual?'':t.id}" style="grid-column:${s+1}/${e+2};grid-row:${r}" title="${esc(t.nombre)} · ${fmtD(t.inicio)} → ${fmtD(t.fin)} · ${pct}%">${isP?'':`<i class="fill" style="width:${pct}%"></i>`}</div>`;
    }
    r++;
  }
  g.innerHTML=h;
  $('#gantt-hint').textContent=`${rows.filter(t=>t.tipo!=='fase').length} actividades · S1 = ${fmtDY(S.meta.inicio)} · ${W} semanas`;
}

function renderPlan(){
  const fs=$('#f-status').value, fr=($('#f-resp').value||'').toLowerCase();
  const rows=ordered();
  let h=`<thead><tr><th style="width:36px">#</th><th>Actividad</th><th>Responsable</th><th>Estatus</th><th>Avance</th><th>Inicio</th><th>Fin</th><th>Sem.</th><th></th></tr></thead><tbody>`;
  let n=0;
  for(const t of rows){
    if(t.tipo==='fase'){
      h+=`<tr class="phase" data-id="${t.virtual?'':t.id}"><td></td><td colspan="3">${esc(t.nombre)}</td><td><div class="prog ${t.avance===100?'hecho':''}"><div class="bar"><i style="width:${t.avance}%"></i></div><span>${t.avance}%</span></div></td><td class="num">${fmtD(t.inicio)}</td><td class="num">${fmtD(t.fin)}</td><td class="num">S${weekOf(t.inicio)}–S${weekOf(t.fin)}</td><td class="act">${t.virtual?'':`<button class="btn icon" data-act="up" data-id="${t.id}" title="Subir">↑</button><button class="btn icon" data-act="down" data-id="${t.id}" title="Bajar">↓</button><button class="btn sm" data-act="edit" data-id="${t.id}">Editar</button>`}</td></tr>`;
      continue;
    }

    n++;
    const late=t.estatus!=='hecho'&&t.fin<todayISO();
    h+=`<tr data-id="${t.id}"><td class="num">${n}</td><td class="name">${esc(t.nombre)}${t.notas?`<small>${esc(t.notas)}</small>`:''}</td><td>${esc(t.resp||'—')}</td><td><span class="chip s-${t.estatus}">${STATUS[t.estatus]||t.estatus}</span></td><td><div class="prog ${t.estatus==='hecho'?'hecho':''}"><div class="bar"><i style="width:${t.estatus==='hecho'?100:(+t.avance||0)}%"></i></div><span>${t.estatus==='hecho'?100:(+t.avance||0)}%</span></div></td><td class="num">${fmtD(t.inicio)}</td><td class="num" style="${late?'color:var(--bad);font-weight:500':''}">${fmtD(t.fin)}</td><td class="num">S${weekOf(t.inicio)}${weekOf(t.fin)!==weekOf(t.inicio)?'–S'+weekOf(t.fin):''}</td><td class="act"><button class="btn icon" data-act="up" data-id="${t.id}" title="Subir">↑</button><button class="btn icon" data-act="down" data-id="${t.id}" title="Bajar">↓</button><button class="btn sm" data-act="edit" data-id="${t.id}">Editar</button></td></tr>`;
  }
  h+='</tbody>';
  $('#plan').innerHTML=h;
}

    :`<li><div class="empty" style="flex:1">Sin riesgos abiertos.</div></li>`;
}

  $('#io-ok').style.display=mode==='export'?'none':'';
  $('#io-hint').textContent=mode==='export'?'Copia este JSON como respaldo o para llevarlo a otra copia del tablero.':'Pega un JSON exportado desde este tablero. Reemplaza todo el plan y la bitácora.';
  dlgIO.showModal();
  if(mode==='export'){ formIO.json.select(); try{ navigator.clipboard.writeText(formIO.json.value).then(()=>toast('Copiado al portapapeles')); }catch(_){} }
}
formIO.addEventListener('submit',e=>{
  if(e.submitter && e.submitter.value!=='ok') return;
  try{ const o=JSON.parse(formIO.json.value); if(!o.tasks) throw new Error('sin tareas'); if(!confirm('Esto reemplaza el plan y la bitácora actuales para todos. ¿Continuar?')){ e.preventDefault(); return; } store.replaceAll({meta:{...S.meta,...(o.meta||{})},tasks:o.tasks||{},log:o.log||{}}); toast('Importado'); }
  catch(x){ e.preventDefault(); $('#io-hint').textContent='El JSON no es válido: '+x.message; }
});

/* ---------- KPI detail ---------- */
function openDetail(k){
  const tasks=Object.values(S.tasks).filter(t=>t.tipo!=='fase');
  let title='', items=[];
  const T=t=>({id:t.id,kind:'task',tx:t.nombre,sub:(t.resp||'—')+(S.tasks[t.fase]?' · '+S.tasks[t.fase].nombre:''),due:fmtD(t.inicio)+' → '+fmtD(t.fin),chip:`<span class="chip s-${t.estatus}">${STATUS[t.estatus]} ${t.avance||0}%</span>`});
  if(k==='curso'){ title='Actividades en curso'; items=tasks.filter(t=>t.estatus==='curso').map(T); }
  else if(k==='hecho'){ title='Actividades completadas'; items=tasks.filter(t=>t.estatus==='hecho').map(T); }
  else if(k==='bloqueado'){ title='Actividades bloqueadas'; items=tasks.filter(t=>t.estatus==='bloqueado').map(T); }
  else if(k==='vencidas'){ title='Actividades vencidas (fecha fin pasada y no completadas)'; items=tasks.filter(t=>t.estatus!=='hecho'&&t.fin<todayISO()).sort((a,b)=>a.fin.localeCompare(b.fin)).map(T); }
  else if(k==='pasos'){ title='Siguientes pasos abiertos'; items=Object.values(S.log).filter(e=>e.tipo==='paso'&&!e.hecho).sort((a,b)=>(a.compromiso||'9').localeCompare(b.compromiso||'9')).map(e=>({id:e.id,kind:'log',tx:e.texto,sub:(e.resp||'')+(e.tareaId&&S.tasks[e.tareaId]?' · '+S.tasks[e.tareaId].nombre:''),due:e.compromiso?'compromiso '+fmtD(e.compromiso):'',chip:e.compromiso&&e.compromiso<todayISO()?'<span class="chip s-bloqueado">vencido</span>':''})); }
  $('#dlg-detail-title').textContent=title+` (${items.length})`;
  $('#detail').innerHTML=items.length?items.map(i=>`<li>${i.chip}<div class="tx">${esc(i.tx)}<small>${esc(i.sub)}</small></div><span class="due">${i.due}</span>${readOnly?'':`<button type="button" class="btn sm" data-act="${i.kind==='task'?'edit':'edit-log'}" data-id="${i.id}" data-close="1">Editar</button>`}</li>`).join('')
    :'<li><div class="empty" style="flex:1">Nada por aquí.</div></li>';
  $('#dlg-detail').showModal();
}

/* ---------- reorder ---------- */
function move(id,dir){
  const t=S.tasks[id]; if(!t) return;
  const sib=Object.values(S.tasks).filter(x=>x.tipo===t.tipo && (t.tipo==='fase' || x.fase===t.fase)).sort((a,b)=>(a.orden||0)-(b.orden||0));
  const i=sib.findIndex(x=>x.id===id); const j=i+dir; if(j<0||j>=sib.length) return;
  // normalize orders within the group, then swap
  sib.forEach((x,k)=>x.orden=(t.tipo==='fase'?(k+1)*10:(sib[0].fase?(S.tasks[sib[0].fase]?.orden||0):0)+k+1));
  const a=sib[i].orden; sib[i].orden=sib[j].orden; sib[j].orden=a;
  store.setTask({...sib[i]}); store.setTask({...sib[j]});
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b){
    const act=b.dataset.act, id=b.dataset.id;
    if(b.dataset.close) $('#dlg-detail').close();
    if(act==='kpi') openDetail(b.dataset.k);
    else if(act==='new-step') openLog(null,{tipo:'paso'});
    else if(act==='new-task') openTask(null,false);
    else if(act==='new-phase') openTask(null,true);
    else if(act==='edit') openTask(id);
    else if(act==='up') move(id,-1);
    else if(act==='down') move(id,1);
    else if(act==='new-log') openLog(null);
    else if(act==='edit-log') openLog(id);
    else if(act==='export') openIO('export');
    else if(act==='download') downloadHTML();
    else if(act==='import') openIO('import');
    else if(act==='toggle'){ const en=S.log[id]; if(en) store.setLog({...en,hecho:b.checked,cerrado:b.checked?todayISO():''}); }
    return;
  }
  const bar=e.target.closest('.gantt .bar[data-id]'); if(bar && bar.dataset.id){ openTask(bar.dataset.id); return; }
  const tab=e.target.closest('.tab'); if(tab){ $$('.tab').forEach(x=>x.setAttribute('aria-selected',x===tab)); $$('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+tab.dataset.tab)); try{ localStorage.setItem(LS_KEY+'-tab',tab.dataset.tab); }catch(_){} }
});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.matches('.kpi[data-act="kpi"]')){ e.preventDefault(); openDetail(e.target.dataset.k); } });
['#f-status','#f-resp'].forEach(s=>$(s).addEventListener('input',renderPlan));
$('#f-logtype').addEventListener('change',renderLog);
try{ const t=localStorage.getItem(LS_KEY+'-tab'); if(t){ const b=$(`.tab[data-tab="${t}"]`); if(b) b.click(); } }catch(_){}

render();
connect();
})();
</script>
</body></html>
